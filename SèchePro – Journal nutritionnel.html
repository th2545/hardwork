const forumStyle=document.createElement('style');forumStyle.textContent=`.forum-welcome{display:flex;align-items:center;gap:14px;background:radial-gradient(ellipse at 0 50%,#38e1ff15,transparent 65%),linear-gradient(145deg,#ffffff0b,#ffffff04)}.forum-welcome h2{margin:0 0 4px;color:var(--tx);letter-spacing:0}.forum-welcome p{margin:0}.forum-icon{display:grid;place-items:center;flex:none;width:52px;height:52px;border:1px solid #38e1ff44;border-radius:17px;background:#38e1ff12;font-size:25px}.forum-setup{border-color:#ffc85766;background:#ffc8570b}.forum-setup>b{color:var(--y)}.forum-setup p{margin:5px 0 0}.forum-compose{display:grid;gap:12px}.forum-compose label{display:grid;gap:4px}.forum-compose input,.forum-compose textarea{width:100%;resize:vertical}.forum-compose textarea{min-height:90px}.forum-compose .row{align-items:center}.forum-compose .row .mu{max-width:65%}.forum-compose button:disabled,.forum-discussions button:disabled{opacity:.5;cursor:not-allowed}.forum-discussions .section-heading{margin-bottom:10px}.forum-message{margin-bottom:9px}.forum-message-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.forum-message-heading b{color:var(--c)}.forum-message-heading time{color:var(--mu);font-size:11px;text-align:right}.forum-message>p{margin:9px 0 0;overflow-wrap:anywhere;white-space:normal}.forum-empty,.forum-error{text-align:center;padding:20px;color:var(--mu)}.forum-error{color:var(--r);text-align:left}@media(max-width:620px){.forum-welcome{align-items:flex-start}.forum-compose .row{align-items:stretch}.forum-compose .row .mu{max-width:60%;font-size:11px}}`;document.head.append(forumStyle);
const closeMobileMenu=()=>{const menu=$('#mobileMenu'),toggle=$('#mobileMenuToggle');if(!menu||menu.hidden)return;menu.hidden=true;toggle.setAttribute('aria-expanded','false');document.body.classList.remove('mobile-menu-open');toggle.focus()};
document.addEventListener('click',event=>{const toggle=event.target.closest('#mobileMenuToggle'),menu=$('#mobileMenu');if(toggle){const opening=menu.hidden;menu.hidden=!opening;toggle.setAttribute('aria-expanded',String(opening));document.body.classList.toggle('mobile-menu-open',opening);if(opening)menu.querySelector('button[data-p]')?.focus();return}if(!menu||menu.hidden)return;if(event.target.closest('[data-menu-close]')||event.target===menu){closeMobileMenu();return}if(event.target.closest('#mobileMenu [data-a=nav]')){closeMobileMenu();$('#mobileMenuToggle').focus()}});
document.addEventListener('click',event=>{const button=event.target.closest('#settingsButton'),panel=$('#themePanel'),close=event.target.closest('[data-theme-close]');if(button){panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));return}if(close){panel.hidden=true;$('#settingsButton').setAttribute('aria-expanded','false');$('#settingsButton').focus();return}if(!panel.hidden&&!panel.contains(event.target)){panel.hidden=true;$('#settingsButton').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMobileMenu();const panel=$('#themePanel');if(panel&&!panel.hidden){panel.hidden=true;$('#settingsButton').setAttribute('aria-expanded','false');$('#settingsButton').focus()}}});
const upd=()=>{save();render()};
function act(a,el){const D=el.dataset,m=+D.m,d=S.page==='journal'||D.m!==undefined?meals():null;switch(a){
case'nav':S.page=D.p;render();scrollTo(0,0);return;
case'forumPost':postForumMessage();return;
case'forumRefresh':loadForumMessages();return;
case'theme':if(!Object.hasOwn(THEMES,D.theme))return;S.theme=applyTheme(D.theme);save();render();$('#themePanel').hidden=false;$('#settingsButton').setAttribute('aria-expanded','true');return;
case'dnav':S.date=addD(S.date,+D.i);render();return;
case'dpick':if(el.value){S.date=el.value;render()}return;
case'pf':{const k=D.k;let v=el.value;if(el.type==='number')v=v===''?'':+v;S.profile[k]=v;if(k==='act')S.profile.af=AF[v];if(k==='w'&&Number.isFinite(v)&&v>=30&&v<=250){const current=S.weights.find(x=>x.d===today());S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),w:v,t:current&&current.t})}save();render();return}
case'saveP':{if(check(S.profile,calc(S.profile)).e.length){toast('Corrigez les erreurs');return}S.ok=true;const current=S.weights.find(x=>x.d===today());S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),w:S.profile.w,t:current&&current.t});upd();toast('Profil enregistré');return}
case'exp':{const j=JSON.stringify(S);$('#io').value=j;navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(j).then(()=>toast('Copié')).catch(e=>{console.error('Impossible de copier la sauvegarde.',e);$('#io').select();toast('Copie impossible : sélectionne le texte exporté')}):($('#io').select(),toast('Texte exporté : copie-le pour le conserver'));return}
case'backup':{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='sechepro-sauvegarde-'+today()+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde téléchargée');return}
case'selectImport':$('#backupFile').click();return;
case'persist':protectLocalData(true);return;
case'install':installApp();return;
case'imp':try{const x=JSON.parse($('#io').value);if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('Le fichier doit contenir un objet de sauvegarde.');S={...S,...x,profile:{...DEF,...x.profile},page:'dash',date:today()};storageLoadError=null;upd();toast('Importé')}catch(e){console.error('Import SèchePro invalide.',e);toast('Sauvegarde invalide : vérifie le JSON')}return;
case'reset':if(confirm('Effacer toutes les données ?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}return;
case'mname':d[m].n=el.value;save();return;case'mtime':d[m].t=el.value;save();return;
case'gram':d[m].items[+D.i].g=Math.max(0,+el.value||0);upd();return;
case'delIng':d[m].items.splice(+D.i,1);upd();return;
case'delMeal':d.splice(m,1);upd();return;
case'addMeal':d.push({n:'Repas '+(d.length+1),t:S.profile.fe,items:[]});upd();return;
case'fs':{const q=el.value.toLowerCase().trim(),box=$('#sr'+m);if(!q){box.innerHTML='';return}const r=foods().filter(f=>f.n.toLowerCase().includes(q)).slice(0,6);box.innerHTML=r.length?r.map(f=>`<button data-a=pick data-m=${m} data-id="${esc(f.id)}">${esc(f.n)} <span class=mu>${f.k} kcal · P${f.p} G${f.c} L${f.f} /100 g</span></button>`).join(''):'<span class=mu>Aucun résultat : créez l\'aliment en bas de page.</span>';return}
case'pick':d[m].items.push({f:D.id,g:100});upd();{const q=$('#q'+m);if(q)q.focus()}return;
case'addCustom':{const n=$('#cn').value.trim();if(!n||$('#ck').value===''){toast('Nom et kcal requis');return}S.custom.push({id:'c'+Date.now(),n,cat:'Personnalisé',k:+$('#ck').value,p:+$('#cp').value||0,c:+$('#cc').value||0,f:+$('#cf').value||0,fi:0});upd();toast('Aliment créé');return}
case'wadd':S.water=S.water||{};S.water[S.date]=cl((S.water[S.date]||0)+(+D.i),0,10000);upd();return;
case'wset':S.water=S.water||{};S.water[S.date]=cl(Math.round((+el.value||0)*1000),0,10000);upd();return;
case'wgoal':S.wg=cl(Math.round((+el.value||2)*1000),500,4000);upd();return;
case'gymView':gymView=D.view==='performance'?'performance':'session';render();return;
case'trackWeek':{const start=S.trackWeek||addD(today(),-((new Date(today()+'T12:00:00').getDay()+6)%7));S.trackWeek=addD(start,+D.i);S.trackDay=S.trackWeek;render();return}
case'trackDay':S.trackDay=D.date;render();return;
case'trackAdd':{const type=$('#trackType').value,note=$('#trackNote').value.trim();S.trainingSessions=Array.isArray(S.trainingSessions)?S.trainingSessions:[];S.trainingSessions.push({id:Date.now(),d:D.date,type,note});save();render();toast('Séance ajoutée au tracking');return}
case'trackDelete':S.trainingSessions=(Array.isArray(S.trainingSessions)?S.trainingSessions:[]).filter(x=>String(x.id)!==D.id);save();render();toast('Séance supprimée');return;
case'planMuscle':{const list=Array.isArray(S.planMuscles)?S.planMuscles:[];S.planMuscles=list.includes(D.muscle)?list.filter(x=>x!==D.muscle):[...list,D.muscle];save();render();return}
case'planExercise':{const list=Array.isArray(S.planExercises)?S.planExercises:[];S.planExercises=list.includes(D.key)?list.filter(x=>x!==D.key):[...list,D.key];save();render();return}
case'startPlan':{const selected=Array.isArray(S.planExercises)?S.planExercises:[],groups=EXG.filter(([name])=>(S.planMuscles||[]).includes(name)),available=groups.flatMap(([,items])=>items.map(([key])=>key)).filter(key=>selected.includes(key));if(!available.length){toast('Choisis au moins un exercice');return}S.gx=available[0];S.page='gym';gymView='session';save();render();scrollTo(0,0);return}
case'gadd':{const c=$('#gc').value.trim(),e=c?'x:'+c:$('#gx').value,w=+$('#gw').value,r=Math.round(+$('#gr').value);if($('#gw').value===''||!(w>=0&&w<=600)||!(r>=1&&r<=100)){toast('Poids (0–600 kg) et répétitions (1–100) requis');return}S.gym=S.gym||[];S.gym.push({id:Date.now(),d:today(),e,w,r});S.gx=$('#gx').value;upd();toast('Série ajoutée');return}
case'gdel':S.gym=(S.gym||[]).filter(x=>String(x.id)!==D.id);upd();return;
case'cday':S.cd=D.id;render();return;
case'cmon':{const[yy,mm]=(S.cm||today().slice(0,7)).split('-').map(Number),dd=new Date(yy,mm-1+(+D.i),1);S.cm=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');render();return}
case'aadd':S.acts=S.acts||{};(S.acts[S.date]=S.acts[S.date]||[]).push({t:$('#at').value,m:Math.max(1,Math.round(+$('#am').value||0)),i:$('#ai').value});upd();toast('Activité ajoutée');return;
case'amin':S.acts[S.date][+D.i].m=Math.max(1,Math.round(+el.value||1));upd();return;
case'adel':S.acts[S.date].splice(+D.i,1);upd();return;
case'steps':S.steps=S.steps||{};S.steps[S.date]=Math.max(0,Math.round(+el.value||0));upd();return;
case'stepadd':S.steps=S.steps||{};S.steps[S.date]=Math.max(0,(S.steps[S.date]||0)+(+D.i));upd();return;
case'sgoal':S.sg=Math.max(0,Math.round(+el.value||0));upd();return;
case'addW':{const w=+$('#ww').value,t=+$('#wt').value,dt=$('#wd').value||today(),prior=S.weights.find(x=>x.d===dt);if(!(w>=30&&w<=250)){toast('Poids invalide (30 à 250 kg)');return}if(t&&!(t>=20&&t<=300)){toast('Tour de taille invalide (20 à 300 cm)');return}S.weights=S.weights.filter(x=>x.d!==dt);S.weights.push({d:dt,w,t:t||prior&&prior.t||undefined});S.profile.w=[...S.weights].sort((a,b)=>a.d.localeCompare(b.d)).pop().w;upd();toast('Pesée enregistrée');return}
case'delW':{const[dd,ww]=D.id.split('|');S.weights=S.weights.filter(x=>!(x.d===dd&&String(x.w)===ww));upd();return}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||['INPUT','SELECT'].includes(b.tagName))return;act(b.dataset.a,b)});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset&&b.dataset.a&&b.dataset.a!=='fs'&&['INPUT','SELECT'].includes(b.tagName))act(b.dataset.a,b)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.a==='fs')act('fs',e.target)});
document.addEventListener('change',e=>{const input=e.target;if(input.id!=='backupFile'||!input.files||!input.files[0])return;input.files[0].text().then(text=>{$('#io').value=text;act('imp',input)}).catch(error=>{console.error('Impossible de lire la sauvegarde.',error);toast('Impossible de lire ce fichier de sauvegarde')})});
if(!S.ok)S.page='profil';render();if(storageLoadError)setTimeout(()=>toast('Impossible de lire les données précédentes. Importe une sauvegarde pour les restaurer.'),0);protectLocalData(false);if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(e=>{console.error('Impossible d’activer le mode hors ligne SèchePro.',e);setTimeout(()=>toast('Mode hors ligne indisponible. Tes données locales restent accessibles.'),0)});
</script></body></html>
